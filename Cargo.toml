[package]
name = "security-engine"
version = "0.1.0"
edition = "2021"

[dependencies]

redis = { version = "0.25", features = ["tokio-comp", "aio"] }
# ... your other dependencies (tokio, axum, sqlx, serde, etc.)
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-native-tls", "postgres", "macros"] }
dotenvy = "0.15"